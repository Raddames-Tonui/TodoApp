# SERVICE  TO START THE WHOLE TODO APPLICATION

services:
  database:
    image: postgres:15
    container_name: todo_database
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    container_name: todo_backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"] 
      interval: 10s
      timeout: 5s
      retries: 5

    #  Add volume for development to sync changes without rebuilding.
    #  Remove volume in production for security & stability
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads  # Persist uploaded files
    # command: gunicorn -w 4 -b 0.0.0.0:5000 app:app --timeout 120
    command: flask run --host=0.0.0.0 --port=5000 --reload # want live-reloading in development, use Flask’s --reload

  frontend:
    build: ./frontend
    restart: always
    container_name: todo_frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    build: ./backend
    container_name: todo_migrate
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["flask", "db", "upgrade"]  # Ensure migrations run correctly
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart:  "no"  # Ensure migration runs once and exits


volumes:
  postgres_data:
  uploads_data:

    # driver: local # (Optional) Store data on the local machine using Docker’s default driver.

